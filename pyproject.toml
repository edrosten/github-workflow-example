[project]
name = "github-workflow-example"
version = "0.1.0"
requires-python = ">=3.10"

[dependency-groups]
lint = [
    "pylint",
    "pyrefly",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 100

[tool.pyrefly]
project-includes = ["**/*.py"]
